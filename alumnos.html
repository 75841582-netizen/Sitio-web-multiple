<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de alumnos</title>
</head>
<body>
  <h1>Alumnos registrados</h1>
  <div id="lista-alumnos"></div>

  <script>
    fetch("https://sem03.onrender.com/alumnos")
      .then(response => response.json())
      .then(data => {
        const contenedor = document.getElementById("lista-alumnos");
        contenedor.innerHTML = "";

        data.forEach(alumno => {
          contenedor.innerHTML += `
            <div>
              <h3>${alumno.nombre} ${alumno.apellidos}</h3>
              <p>Cursos: ${alumno.cursos.join(", ")}</p>
            </div>
            <hr>
          `;
        });
      })
      .catch(error => {
        console.error("Error:", error);
        document.getElementById("lista-alumnos").innerHTML =
          "<p>Error al cargar los datos.</p>";
      });
  </script>
</body>
</html>
