<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Completo</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>

<div class="container">
    <h2>Registro de Usuario</h2>

    <form id="formulario">
        
        <label>Nombre completo</label>
        <input type="text" id="nombre" placeholder="Ingresa tu nombre">

        <label>Correo electrónico</label>
        <input type="email" id="correo" placeholder="ejemplo@email.com">

        <label>Contraseña</label>
        <input type="password" id="password" placeholder="********">

        <label>Edad</label>
        <input type="number" id="edad" min="1">

        <label>Género</label>
        <select id="genero">
            <option value="">Seleccione</option>
            <option>Masculino</option>
            <option>Femenino</option>
            <option>Otro</option>
        </select>

        <label>Intereses</label>
        <div class="checkbox-group">
            <label><input type="checkbox" value="Deporte"> Deporte</label>
            <label><input type="checkbox" value="Tecnología"> Tecnología</label>
            <label><input type="checkbox" value="Música"> Música</label>
        </div>

        <label>Mensaje</label>
        <textarea id="mensaje" rows="4"></textarea>

        <button type="submit">Enviar</button>

        <p id="error" class="error"></p>
        <p id="success" class="success"></p>

    </form>
</div>

<script src="formulario.js"></script>
</body>
</html>
